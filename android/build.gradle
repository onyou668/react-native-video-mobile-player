buildscript {
  ext.VideoMobilePlayer = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return VideoMobilePlayer[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "org.jetbrains.kotlin.plugin.compose"


apply plugin: "com.facebook.react"

android {
  namespace "com.videomobileplayer"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  buildFeatures {
    compose true
  }

  sourceSets {
    main.java.srcDirs += [
      "video-mobile-player/player-core/src/main/java",
      "video-mobile-player/player-engine-media3/src/main/java",
      "video-mobile-player/player-engine-ijk/src/main/java",
      "video-mobile-player/player-compose/src/main/java"
    ]
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.4"
  implementation "androidx.media3:media3-exoplayer:1.8.0"
  implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
  implementation "androidx.media3:media3-exoplayer-dash:1.8.0"
  implementation "io.github.blankyn:ijkplayer-java:0.0.16"
  implementation "io.github.blankyn:ijkplayer-ex_so:0.0.16"
  implementation platform("androidx.compose:compose-bom:2025.12.00")
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.ui:ui-tooling-preview"
  implementation "androidx.compose.material3:material3"
  implementation "androidx.compose.material:material-icons-extended"
}
